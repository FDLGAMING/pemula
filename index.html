
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Silent Bahar 🥀</title>
  <style>
    body {
      margin: 0;
      background: black;
      color: white;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      animation: fadeIn 2s ease forwards;
    }

    .logo {
      font-size: 5rem;
      cursor: pointer;
      transition: transform 0.6s ease, filter 0.6s ease;
      animation: glitchLogo 1.5s ease-in-out;
    }

    .logo:hover {
      transform: rotate(360deg) scale(1.1);
      filter: drop-shadow(0 0 20px #ff0055);
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
      animation: fadeInUp 2s ease-in-out 1s forwards;
      opacity: 0;
    }

    .links {
      animation: fadeInUp 2s ease-in-out 1.5s forwards;
      opacity: 0;
    }

    .links a {
      color: #00ffff;
      text-decoration: none;
      margin: 0.5rem;
      font-size: 1.2rem;
      transition: color 0.3s;
    }

    .links a:hover {
      color: #ff00aa;
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes glitchLogo {
      0% { transform: scale(0.8) rotate(0deg); filter: brightness(0); }
      50% { transform: scale(1.2) rotate(10deg); filter: drop-shadow(0 0 20px #f0f); }
      100% { transform: scale(1) rotate(0deg); filter: drop-shadow(0 0 0); }
    }
  #menuBtn {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 9999;
    background: transparent;
    border: 2px solid cyan;
    color: cyan;
    font-size: 24px;
    padding: 5px 10px;
    cursor: pointer;
}

#sideMenu {
    position: fixed;
    top: 0;
    left: -280px;
    width: 260px;
    height: 100vh;
    background: #000;
    border-right: 2px solid cyan;
    z-index: 10000;
    padding: 25px;
    box-sizing: border-box;
    transition: left 0.3s ease;
}

#sideMenu.active {
    left: 0;
}

#sideMenu h2 {
    color: cyan;
    margin-top: 45px;
}

#sideMenu a {
    display: block;
    color: white;
    text-decoration: none;
    padding: 15px 0;
    border-bottom: 1px solid #333;
}

#closeBtn {
    position: absolute;
    top: 15px;
    right: 15px;
    z-index: 10001;
    background: transparent;
    border: none;
    color: #ff00ff;
    font-size: 25px;
    cursor: pointer;
    }
  #about {
    min-height: 100vh;
    padding: 100px 20px 60px;
    box-sizing: border-box;
    font-family: "Courier New", monospace;
}

.about-box {
    max-width: 850px;
    margin: auto;
}

.about-box h1 {
    text-align: center;
    color: cyan;
    letter-spacing: 3px;
    margin-bottom: 40px;
    text-shadow: 0 0 10px cyan;
}

.info-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
}

.info-card {
    padding: 18px;
    border: 1px solid cyan;
    background: rgba(0, 255, 255, 0.03);
}

.info-card span {
    display: block;
    color: #ff00ff;
    font-size: 12px;
    margin-bottom: 8px;
}

.info-card strong {
    color: white;
    font-size: 14px;
}

.about-text {
    margin-top: 30px;
    padding: 20px;
    border-left: 2px solid cyan;
    background: rgba(255, 255, 255, 0.02);
}

.about-text h2 {
    color: #ff00ff;
    font-size: 18px;
}

.about-text p {
    color: white;
    line-height: 1.7;
}

.about-footer {
    margin-top: 50px;
    text-align: center;
    color: cyan;
    font-size: 12px;
    letter-spacing: 2px;
}

@media (max-width: 600px) {
    .info-grid {
        grid-template-columns: 1fr;
    }
      }
  </style>
</head>
<body>
  <div class="logo" onclick="rotateLogo(this)">🥀</div>
  <h1>SILENT BAHAR</h1>
  <div class="links">
    <a href="https://www.youtube.com/@fadilldarmawan" target="_blank">YouTube</a>
    <a href="https://www.instagram.com/silent_bahar_pm" target="_blank">Instagram</a>
    <a href="https://www.facebook.com/share/1Ej5ijttur/" target="_blank">Facebook</a>
    <a href="https://www.tiktok.com/@fdl01gaming13" target="_blank">TikTok</a>
    <a href="https://wa.me/6283876176778" target="_blank">WhatsApp</a>
  </div>

  <audio autoplay loop>
    <source src="https://files.catbox.moe/5nt2qa.mp3" type="audio/mpeg">
    Your browser does not support the audio element.
  </audio>

  <script>
    function rotateLogo(element) {
      element.style.transform = 'rotate(360deg) scale(1.2)';
      element.style.filter = 'drop-shadow(0 0 30px #ff00ff)';
      setTimeout(() => {
        element.style.transform = 'rotate(0deg) scale(1)';
        element.style.filter = 'drop-shadow(0 0 0 #000)';
      }, 1000);
    }
  </script>
  
<button id="menuBtn">☰</button>

<div id="sideMenu">
    <button id="closeBtn">✕</button>
    <h2>SILENT BAHAR</h2>

    <a href="index.html">🏠 HOME</a>

    <a href="projects.html">💻 PROJECTS</a>
    <a href="music.html">🎵 MUSIC</a>
    <a href="status.html">👥 STATUS</a>
  <a href="code.html">💻 CODE LAB</a>
</div>
  <script>
const menuBtn = document.getElementById("menuBtn");
const sideMenu = document.getElementById("sideMenu");
const closeBtn = document.getElementById("closeBtn");

menuBtn.addEventListener("click", function() {
    sideMenu.classList.add("active");
});

closeBtn.addEventListener("click", function() {
    sideMenu.classList.remove("active");
});
  </script>
</body>
</html>
